# Stage ordering (rather than `needs:`) makes publish wait for the test matrix:
# `needs:` requires the needed job to exist in the same pipeline, which is not
# guaranteed when the two jobs have different `only: changes` rules.
stages:
  - test
  - deploy

test:
  stage: test
  image: ghcr.io/astral-sh/uv:0.9.0-python3.12-bookworm
  parallel:
    matrix:
      - PYTHON: ["3.10", "3.11", "3.12", "3.13", "3.14"]
  script:
    - uv run --locked -p "$PYTHON" pytest -q
  only:
    refs:
    - master
    - merge_requests

pages:
  stage: deploy
  image: ghcr.io/astral-sh/uv:0.9.0-python3.12-bookworm
  script:
  - uv sync --locked --group docs
  - uv run --locked make -C docs html BUILDDIR=build
  - mkdir -p public
  - cp -r docs/build/html/* public/
  artifacts:
    paths:
      - public
  only:
    refs:
    - master
    - merge_requests
    changes:
    - docs/**/*
    - scrudful/**/*
    - pyproject.toml

publish:
  stage: deploy
  image: ghcr.io/astral-sh/uv:0.9.0-python3.12-bookworm
  variables:
    UV_PUBLISH_TOKEN: $POETRY_PYPI_ACCESS_TOKEN
  before_script:
    - git config --global user.name "Gitlab CI/CD"
    - git config --global user.email "CICD@gitlab.com"

  script:
    - uv version --bump patch --no-sync
    - uv build
    - uv publish
    - git status
    - git add .
    - git commit -m "[ci skip] updated to $(uv version)"
    - git push -o ci-skip http://root:$PROJECT_ACCESS_TOKEN@gitlab.com/openteams/scrudful HEAD:master
  artifacts:
    paths:
    - dist
  only:
    refs:
    - master
    - merge_requests
    changes:
    - scrudful

