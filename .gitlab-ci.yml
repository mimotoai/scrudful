image: continuumio/miniconda3:latest

before_script:
  - conda install -c conda-forge make sphinx django sphinx_rtd_theme

pages:
  script:
  - mkdir -p public
  - cd docs
  - make clean
  - make html
  - cp -r build/html/* ../public/.
  artifacts:
    paths:
      - public
  only:
    refs:
    - master
    - merge_requests
    changes:
    - docs

publish:
  image: ghcr.io/astral-sh/uv:0.9.0-python3.12-bookworm
  variables:
    UV_PUBLISH_TOKEN: $POETRY_PYPI_ACCESS_TOKEN
  before_script:
    - git config --global user.name "Gitlab CI/CD"
    - git config --global user.email "CICD@gitlab.com"

  script:
    - uv version --bump patch --no-sync
    - uv build
    - uv publish
    - git status
    - git add .
    - git commit -m "[ci skip] updated to $(uv version)"
    - git push -o ci-skip http://root:$PROJECT_ACCESS_TOKEN@gitlab.com/openteams/scrudful HEAD:master
  artifacts:
    paths:
    - dist
  only:
    refs:
    - master
    - merge_requests
    changes:
    - scrudful

