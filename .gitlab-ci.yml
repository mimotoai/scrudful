# Pipelines run for merge requests and for the default branch only (no
# duplicate branch + MR pipelines). `test` runs in both and `version-check` in
# merge requests; `pages` and `publish` deploy, so they run only on the default
# branch.
#
# Releasing: a merge request that changes the package sets the version to
# release (`uv version --bump minor`, `uv version 1.0.0`); merging it publishes
# that version. See scripts/release.py.
#
# Stage ordering (rather than `needs:`) makes the deploy jobs wait for the
# whole test matrix: with stages, a deploy job starts only after every job of
# the earlier stage has succeeded.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - test
  - deploy

test:
  stage: test
  image: ghcr.io/astral-sh/uv:0.9.0-python3.12-bookworm
  parallel:
    matrix:
      - PYTHON: ["3.10", "3.11", "3.12", "3.13", "3.14"]
  script:
    - uv run --locked -p "$PYTHON" pytest -q

# The lowest framework releases pyproject.toml supports, which the locked
# `test` matrix never installs: each floor-<framework> job installs scrudful
# with the test tools (`.floor`), then pins its framework and runs that
# adapter's test modules.
.floor:
  stage: test
  image: ghcr.io/astral-sh/uv:0.9.0-python3.12-bookworm
  before_script:
    - uv venv -p 3.12 /tmp/floor
    - uv pip install -p /tmp/floor/bin/python -e ".[drf,fastapi,ninja]" pytest pytest-django pytest-randomly jsonschema pyld freezegun

# fastapi>=0.100: a FastAPI that copies an included router's routes. Its
# Starlette 0.27 test client needs the pydantic, anyio and httpx of its time;
# newer ones deprecate what it uses, which the suite's warnings-as-errors fails.
floor-fastapi:
  extends: .floor
  script:
    - uv pip install -p /tmp/floor/bin/python "fastapi==0.100.*" "pydantic==2.3.*" "anyio<4" "httpx==0.24.*"
    - /tmp/floor/bin/python -m pytest -q -p no:cacheprovider tests/test_fastapi_adapter.py tests/test_fastapi_hsr.py tests/test_wire_fastapi.py

# A merge request that changes the package (scrudful/, or the published parts
# of pyproject.toml) must raise the version above the target branch's and every
# release on PyPI.
version-check:
  stage: test
  image: ghcr.io/astral-sh/uv:0.9.0-python3.12-bookworm
  variables:
    TARGET: origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
  script:
    - git fetch -q origin "$CI_MERGE_REQUEST_DIFF_BASE_SHA" "+refs/heads/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}:refs/remotes/${TARGET}"
    - uv run --no-project --with packaging python scripts/release.py check-bump "$CI_MERGE_REQUEST_DIFF_BASE_SHA" "$TARGET"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

pages:
  stage: deploy
  image: ghcr.io/astral-sh/uv:0.9.0-python3.12-bookworm
  script:
    - uv sync --locked --group docs
    - uv run --locked make -C docs html BUILDDIR=build SPHINXOPTS="-W --keep-going"
    - mkdir -p public
    - cp -r docs/build/html/* public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - docs/**/*
        - scrudful/**/*
        - pyproject.toml
        - README.rst
        - CHANGELOG.rst

# Publishes the version in pyproject.toml if it isn't on PyPI yet; merges that
# don't change the version publish nothing.
#
# Only the tip of the default branch publishes: a job for a superseded commit
# (a late or retried pipeline) exits without publishing, so older code is never
# released under a newer version. The tag and GitLab release (vX.Y.Z) are
# created before the upload, so a failed upload can simply be retried. A partial
# upload (e.g. only the sdist) needs a new version.
publish:
  stage: deploy
  image: ghcr.io/astral-sh/uv:0.9.0-python3.12-bookworm
  # Serialises publish jobs: concurrent pipelines would race on the upload.
  resource_group: publish
  variables:
    UV_PUBLISH_TOKEN: $UV_PYPI_ACCESS_TOKEN
  script:
    - git fetch -q origin "$CI_DEFAULT_BRANCH"
    - |
      if [ "$(git rev-parse FETCH_HEAD)" != "$CI_COMMIT_SHA" ]; then
        echo "$CI_COMMIT_SHA is no longer the tip of ${CI_DEFAULT_BRANCH}; skipping"
        exit 0
      fi
    # Exit status 10: this version is already on PyPI.
    - |
      status=0
      uv run --no-project --with packaging python scripts/release.py needs-release || status=$?
      if [ "$status" -eq 10 ]; then exit 0; fi
      if [ "$status" -ne 0 ]; then exit "$status"; fi
    - ': "${UV_PYPI_ACCESS_TOKEN:?}"'
    - uv run --no-project --with packaging python scripts/release.py create-release
    - uv build
    - uv publish
  artifacts:
    paths:
      - dist
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
