[project]
name = "scrudful"
version = "0.3.0"
description = "HTTP conditional-request and Link-header helpers for SCRUDful REST APIs (Django REST Framework, FastAPI)"
authors = [{ name = "David Charboneau", email = "david@openteams.com" }]
requires-python = ">=3.10"
readme = "README.rst"
license = "MIT AND BSD-3-Clause"
license-files = ["LICENSE", "LICENSES/Django-BSD-3-Clause.txt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.urls]
Source = "https://gitlab.com/openteams/scrudful"
Changelog = "https://gitlab.com/openteams/scrudful/-/blob/master/CHANGELOG.rst"

[project.optional-dependencies]
drf = ["django>=4.2", "djangorestframework>=3.15"]
fastapi = ["fastapi>=0.100"]

[dependency-groups]
dev = [
    "scrudful[drf,fastapi]",
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-django>=4.8",
    "pytest-randomly>=3.15",
    "freezegun>=1.5",
    # Starlette's TestClient: Starlette 1.x deprecates httpx in favour of httpx2.
    "httpx2>=2.14",
    "black>=24",
    "flake8>=7",
    "uvicorn>=0.30",
]
docs = [
    "sphinx>=7",
    "sphinx-rtd-theme>=2",
    "sphinx-autobuild>=2024.2.4",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
# The sdist also carries the changelog and the tests, with the example apps
# they exercise (pyproject.toml, README, licenses and the package are always
# included).
source-include = ["CHANGELOG.rst", "tests/**", "examples/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "examples/scrudful_rest_framework"]
DJANGO_SETTINGS_MODULE = "scrudful_rest_framework.settings"
filterwarnings = ["error"]
